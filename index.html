<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Playoff Tournament — Anime.js</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#374151;color:#fff;font-family:'Press Start 2P',monospace;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:100vh}
.scanlines{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:50;background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,0.15) 50%);background-size:100% 3px}
.vignette{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,0.6) 100%)}
#stage{position:relative;width:1000px;height:620px}
.title{text-align:center;font-size:18px;line-height:1.4;margin-top:10px;text-shadow:0 0 6px #fff,0 0 12px #0ff;opacity:0;position:relative;z-index:5}
.label{position:absolute;font-size:14px;opacity:0;z-index:5;text-shadow:0 0 8px currentColor}
.label-west{top:52px;left:65px;color:#0ff}
.label-east{top:52px;left:865px;color:#f0a}
.bracket{position:absolute;top:85px;left:0;width:1000px;height:500px}
.bracket svg{position:absolute;top:0;left:0;pointer-events:none;z-index:1}
.match-card{position:absolute;width:140px;background:#1e293b;border:2px solid #475569;padding:6px 8px;opacity:0;z-index:2;will-change:transform,opacity;overflow:hidden}
.match-card.winner{border-color:#0f0;box-shadow:0 0 10px rgba(0,255,0,0.3)}
.match-card.final{border-color:#fc0;box-shadow:0 0 14px rgba(252,204,0,0.5)}
.team-row{font-size:9px;padding:2px 0;color:#ccc}
.team-row.win{color:#0f0;text-shadow:0 0 4px #0f0}
.team-row.lose{color:#444;text-decoration:line-through}
.vs-text{text-align:center;font-size:9px;color:#666;padding:3px 0}
.player-list{overflow:hidden;height:0}
.player-row{font-size:7px;color:#777;padding:1px 0 1px 10px;opacity:0}
.player-row.win{color:#0c0}
.player-row.lose{color:#333}
.ghost-badge{position:absolute;background:#021108;border:2px solid #0f0;color:#0f0;padding:5px 10px;font-size:9px;z-index:20;box-shadow:0 0 10px rgba(0,255,0,0.6);pointer-events:none;opacity:0;white-space:nowrap;border-radius:2px}
.champion-banner{position:absolute;top:180px;left:50%;transform:translateX(-50%);font-size:20px;color:#fc0;text-shadow:0 0 12px #fc0,0 0 24px #f80;opacity:0;z-index:10;text-align:center;white-space:nowrap}
.prize-container{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;z-index:5;width:700px}
.prize-card{width:80px;height:80px;border:3px solid #444;background:#2d3a4e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:6px;opacity:0;transform:scale(0.5) translateY(50px);text-align:center;padding:4px;line-height:1.3}
.prize-winner{border-color:#ff6b9d;box-shadow:0 0 12px rgba(255,107,157,0.6);color:#ff6b9d}
.prize-finalist{border-color:#a855f7;box-shadow:0 0 12px rgba(168,85,247,0.6);color:#a855f7}
.progress-bg{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:60%;height:6px;background:#222;border:1px solid #333;z-index:5}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#0f0,#0ff)}
</style>
</head>
<body>
<div class="vignette"></div>
<div class="scanlines"></div>
<div id="stage">
  <div class="title">PLAYOFF<br>ПУТЬ К ПОБЕДЕ</div>
  <div class="label label-west">ЗАПАД</div>
  <div class="label label-east">ВОСТОК</div>
  <div class="bracket" id="bracket">
    <svg width="1000" height="500" id="lines"></svg>
  </div>
  <div class="champion-banner" id="champion"></div>
  <div class="prize-container" id="prizes"></div>
  <div class="progress-bg"><div class="progress-fill" id="progress"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script>
const bracket = document.getElementById('bracket');
const linesSvg = document.getElementById('lines');
const progress = document.getElementById('progress');
const championEl = document.getElementById('champion');
const prizesEl = document.getElementById('prizes');

// ── Data ──
const westTeams = ['ALPHA','BRAVO','CHARLIE','DELTA'];
const eastTeams = ['ECHO','FOXTROT','GOLF','HOTEL'];
const namePool = ['neo','viper','frost','reaper','blaze','shade','echo','nova','onyx','raven','jolt','kira','zeno','nyx','axis','flux','surge','volt','hex','rune','kage','wisp','dusk','jade','pyre','glyph','rift','void','haze','bolt'];
const prizeNames = ['AK-47 Жгучая ярость','AWP Зелёная энергия','AK-47 Дилетанты','M4A1-S Уединение','AK-47 Фантом'];

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function genPlayers(){return Array.from({length:5},()=>rnd(namePool))}
function pickWinner(a,b){return Math.random()>0.5?a:b}

// ── Positions (even spacing, centers at 100, 300, 500, 700, 900) ──
const POS = {
  qf1:{x:30,y:30},   qf2:{x:30,y:230},
  qf3:{x:830,y:30},  qf4:{x:830,y:230},
  sf1:{x:230,y:130},sf2:{x:630,y:130},
  final:{x:430,y:130}
};

// ── Lines (center-to-center, clean L-shaped) ──
const linePaths = [
  'M 100 55 H 200 V 155 H 300',
  'M 100 255 H 200 V 155 H 300',
  'M 900 55 H 800 V 155 H 700',
  'M 900 255 H 800 V 155 H 700',
  'M 300 155 H 500',
  'M 700 155 H 500'
];
linePaths.forEach((d,i)=>{
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d);
  p.setAttribute('stroke','#6b7280');
  p.setAttribute('stroke-width','2');
  p.setAttribute('fill','none');
  p.setAttribute('opacity','0');
  p.id='line-'+i;
  linesSvg.appendChild(p);
});

// ── Create card ──
function createCard(id, tA, tB, pA, pB, x, y, isFinal){
  const c=document.createElement('div');
  c.className='match-card'+(isFinal?' final':'');
  c.id=id;
  c.style.left=x+'px';
  c.style.top=y+'px';
  c.innerHTML = `
    <div class="team-row" data-t="A">${tA}</div>
    <div class="player-list" data-pl="A">${pA.map(p=>`<div class="player-row">${p}</div>`).join('')}</div>
    <div class="vs-text">VS</div>
    <div class="team-row" data-t="B">${tB}</div>
    <div class="player-list" data-pl="B">${pB.map(p=>`<div class="player-row">${p}</div>`).join('')}</div>
  `;
  return c;
}

// ── Setup tournament ──
const wShuf = shuffle(westTeams);
const eShuf = shuffle(eastTeams);
const qf = [
  [wShuf[0],wShuf[1]], [wShuf[2],wShuf[3]],
  [eShuf[0],eShuf[1]], [eShuf[2],eShuf[3]]
];
const teamPlayers = {};
[...westTeams,...eastTeams].forEach(t=>{teamPlayers[t]=genPlayers()});

const qfCards = [];
const qfWinners = [];
for(let i=0;i<4;i++){
  const pos = POS['qf'+(i+1)];
  const card = createCard('qf'+(i+1), qf[i][0], qf[i][1], teamPlayers[qf[i][0]], teamPlayers[qf[i][1]], pos.x, pos.y, false);
  bracket.appendChild(card);
  qfCards.push(card);
  qfWinners.push(pickWinner(qf[i][0], qf[i][1]));
}

// Shuffle QF winners randomly into SF
const sfShuffle = shuffle(qfWinners);
const sfTeams = [[sfShuffle[0],sfShuffle[1]], [sfShuffle[2],sfShuffle[3]]];
const sfCards = [];
const sfWinners = [];
for(let i=0;i<2;i++){
  const pos = POS['sf'+(i+1)];
  const card = createCard('sf'+(i+1), sfTeams[i][0], sfTeams[i][1], teamPlayers[sfTeams[i][0]], teamPlayers[sfTeams[i][1]], pos.x, pos.y, false);
  bracket.appendChild(card);
  sfCards.push(card);
  sfWinners.push(pickWinner(sfTeams[i][0], sfTeams[i][1]));
}

// Final
const finalCard = createCard('final', sfWinners[0], sfWinners[1], teamPlayers[sfWinners[0]], teamPlayers[sfWinners[1]], POS.final.x, POS.final.y, true);
bracket.appendChild(finalCard);
const champion = pickWinner(sfWinners[0], sfWinners[1]);
const finalist = champion === sfWinners[0] ? sfWinners[1] : sfWinners[0];

// ── Helper: highlight winner in a card ──
function highlightWinner(cardId, winner, teamA, teamB){
  const card = document.getElementById(cardId);
  const rows = card.querySelectorAll('.team-row');
  const lists = card.querySelectorAll('.player-list');
  if(teamA === winner){
    rows[0].classList.add('win'); rows[1].classList.add('lose');
    lists[0].querySelectorAll('.player-row').forEach(r=>r.classList.add('win'));
    lists[1].querySelectorAll('.player-row').forEach(r=>r.classList.add('lose'));
  } else {
    rows[1].classList.add('win'); rows[0].classList.add('lose');
    lists[1].querySelectorAll('.player-row').forEach(r=>r.classList.add('win'));
    lists[0].querySelectorAll('.player-row').forEach(r=>r.classList.add('lose'));
  }
}

// ── Ghost badge creation ──
function makeGhost(teamName, fromX, fromY){
  const g = document.createElement('div');
  g.className = 'ghost-badge';
  g.textContent = teamName;
  g.style.left = fromX+'px';
  g.style.top = fromY+'px';
  bracket.appendChild(g);
  return g;
}

// ── Animation timeline (15 seconds) ──
const tl = anime.timeline({easing:'easeOutQuad',duration:500});

// 0.0–0.5s: Title + labels
tl.add({targets:'.title',opacity:[0,1],scale:[0.85,1],duration:400})
  .add({targets:['.label-west','.label-east'],opacity:[0,1],translateY:[-8,0],duration:300},'-=200');

// 0.5–1.2s: QF cards appear
tl.add({targets:[qfCards[0],qfCards[1],qfCards[2],qfCards[3]],opacity:[0,1],translateY:[18,0],delay:anime.stagger(120),duration:350});

// 1.2–2.0s: Expand QF to show 5v5
tl.add({targets:[qfCards[0],qfCards[1],qfCards[2],qfCards[3]].flatMap(c=>[...c.querySelectorAll('.player-list')]),height:['0px','58px'],duration:300,easing:'easeOutCubic'},'-=200')
  .add({targets:[qfCards[0],qfCards[1],qfCards[2],qfCards[3]].flatMap(c=>[...c.querySelectorAll('.player-row')]),opacity:[0,1],delay:anime.stagger(30),duration:250},'-=200');

// 2.0–2.5s: VS flash + determine QF winners
tl.add({targets:[qfCards[0],qfCards[1],qfCards[2],qfCards[3]].map(c=>c.querySelector('.vs-text')),scale:[1,1.6,1],color:['#666','#ff0','#666'],duration:350,delay:anime.stagger(80)},'-=100');
tl.add({begin:()=>{for(let i=0;i<4;i++)highlightWinner('qf'+(i+1),qfWinners[i],qf[i][0],qf[i][1])},duration:200});

// 2.6–4.5s: All QF winners fly to SF simultaneously
const sfAssignment = [];
sfShuffle.forEach((w,i)=>{
  const sfIdx = i<2?0:1;
  const slot = i%2;
  sfAssignment.push({team:w, sf:sfIdx, slot:slot});
});

const ghosts = [];
qfWinners.forEach((w,qi)=>{
  const qfPos = POS['qf'+(qi+1)];
  const ghost = makeGhost(w, qfPos.x+20, qfPos.y+8);
  ghosts.push({el:ghost, team:w, qfIdx:qi});
});

ghosts.forEach(g=>{
  let target = null;
  for(const a of sfAssignment){
    if(a.team===g.team){target=a;break}
  }
  g.target = target;
});

tl.add({targets:ghosts.map(g=>g.el),opacity:[0,1,1,0],translateX:ghosts.map(g=>POS['sf'+(g.target.sf+1)].x+20-(POS['qf'+(g.qfIdx+1)].x+20)),translateY:ghosts.map(g=>POS['sf'+(g.target.sf+1)].y+(g.target.slot===0?8:95)-(POS['qf'+(g.qfIdx+1)].y+8)),scale:[{value:0.5,duration:0},{value:1.2,duration:200},{value:1,duration:300},{value:0,duration:300}],delay:anime.stagger(150,{from:'center'}),duration:1200,easing:'easeInOutCubic'});

// 4.5–4.8s: SF cards appear
tl.add({targets:[sfCards[0],sfCards[1]],opacity:[0,1],translateY:[18,0],delay:anime.stagger(120),duration:300});

// 4.8–5.5s: Expand SF to 5v5
tl.add({targets:[sfCards[0],sfCards[1]].flatMap(c=>[...c.querySelectorAll('.player-list')]),height:['0px','58px'],duration:250,easing:'easeOutCubic'},'-=100')
  .add({targets:[sfCards[0],sfCards[1]].flatMap(c=>[...c.querySelectorAll('.player-row')]),opacity:[0,1],delay:anime.stagger(30),duration:200},'-=150');

// 5.5–6.0s: VS flash + determine SF winners
tl.add({targets:[sfCards[0],sfCards[1]].map(c=>c.querySelector('.vs-text')),scale:[1,1.6,1],color:['#666','#ff0','#666'],duration:300,delay:80},'-=50');
tl.add({begin:()=>{for(let i=0;i<2;i++)highlightWinner('sf'+(i+1),sfWinners[i],sfTeams[i][0],sfTeams[i][1])},duration:150});

// 6.2–7.5s: SF winners fly to Final
const sfGhosts = [];
sfWinners.forEach((w,si)=>{
  const sfPos = POS['sf'+(si+1)];
  const g = makeGhost(w, sfPos.x+20, sfPos.y+8);
  sfGhosts.push({el:g, team:w, sfIdx:si});
});

tl.add({targets:sfGhosts.map(g=>g.el),opacity:[0,1,1,0],translateX:sfGhosts.map(g=>POS.final.x+20-(POS['sf'+(g.sfIdx+1)].x+20)),translateY:sfGhosts.map(g=>POS.final.y+(g.sfIdx===0?8:95)-(POS['sf'+(g.sfIdx+1)].y+8)),scale:[{value:0.5,duration:0},{value:1.2,duration:150},{value:1,duration:200},{value:0,duration:250}],delay:anime.stagger(150),duration:1000,easing:'easeInOutCubic'});

// 7.5–8.0s: Final card appears + expand
tl.add({targets:finalCard,opacity:[0,1],translateY:[18,0],duration:300});
tl.add({targets:[...finalCard.querySelectorAll('.player-list')],height:['0px','58px'],duration:250,easing:'easeOutCubic'},'-=100')
  .add({targets:[...finalCard.querySelectorAll('.player-row')],opacity:[0,1],delay:anime.stagger(30),duration:200},'-=150');

// 8.0–8.4s: VS flash + champion
tl.add({targets:finalCard.querySelector('.vs-text'),scale:[1,1.8,1],color:['#666','#fc0','#666'],duration:350},'-=50');
tl.add({begin:()=>highlightWinner('final',champion,sfWinners[0],sfWinners[1]),duration:150});

// 8.5–9.5s: Champion banner
tl.add({targets:championEl,opacity:[0,1],scale:[0.5,1.1,1],duration:500,easing:'easeOutBack'});
championEl.innerHTML = '&#x1F451; ' + champion + ' &#x1F451;<br><span style="font-size:12px;color:#f80">ЧЕМПИОН</span>';

// 9.5–15s: 10 prizes (5 winner pink + 5 finalist purple)
const champPlayers = teamPlayers[champion];
const finalPlayers = teamPlayers[finalist];

for(let i=0;i<5;i++){
  const pc=document.createElement('div');
  pc.className='prize-card prize-winner';
  pc.innerHTML=`<div>${champPlayers[i]}</div><div style="margin-top:4px;font-size:5px;opacity:0.7">${rnd(shuffle(prizeNames))}</div>`;
  prizesEl.appendChild(pc);
}
for(let i=0;i<5;i++){
  const pc=document.createElement('div');
  pc.className='prize-card prize-finalist';
  pc.innerHTML=`<div>${finalPlayers[i]}</div><div style="margin-top:4px;font-size:5px;opacity:0.7">${rnd(shuffle(prizeNames))}</div>`;
  prizesEl.appendChild(pc);
}

tl.add({targets:[...prizesEl.children],opacity:[0,1],scale:[0.5,1],translateY:[50,0],delay:anime.stagger(100),duration:400,easing:'easeOutBack'},'-=300');

// Progress bar (continuous over 15s)
anime({targets:progress,width:['0%','100%'],duration:15000,easing:'linear'});

// Lines fade in at 0.6s
setTimeout(()=>{linePaths.forEach((_,i)=>{anime({targets:'#line-'+i,opacity:[0,1],duration:400,delay:i*80})})},600);
</script>
</body>
</html>
