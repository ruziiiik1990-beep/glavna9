<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Auto Particles Showcase (Optimized)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #09090b; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; background: transparent; }
    </style>
</head>
<body>

<canvas class="webgl"></canvas>

<!-- Подключаем официальную стабильную сборку Three.js из CDN, чтобы не раздувать код -->
<script src="https://cloudflare.com"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.querySelector('canvas.webgl');
        const scene = new THREE.Scene();

        // Полный список имен твоих скинов
        const weaponsList = [
            'ak-47_kolymaga.png',
            'AK-47_diletanti.png',
            'AK-47_fantomni_vreditel.png',
            'AK-47_led9noi_ygol.png',
            'AK-47_nyvo_ryzh.png',
            'AK-47_zhgycha9_9rkost.png',
            'AWP_dvoistvennost.png',
            'AWP_konec.png',
            'AWP_led9noi_ygol.png',
            'AWP_mortic.png',
            'AWP_zelena9_energia.png',
            'AWPelitnoe_snar9zhenie.png',
            'M4A1-S_4erni_lotoc.png',
            'M4A1-S_diki_tysovchik.png',
            'M4A1-S_no4noi_koshmar.png',
            'M4A1-S_panel_ypravleni9.png',
            'M4A1-S_stratosfera.png',
            'M4A1-S_yedinenie.png',
            'M4A4_adok.png',
            'M4A4_zybna9_fei.png'
        ];
        
        let currentWeaponIndex = 0;
        let geometry = null;
        let material = null;
        let points = null;

        let targetPositions = [];
        let colors = [];
        let isChanging = false;
        let weaponStartTime = performance.now(); 

        const sizes = { width: window.innerWidth, height: window.innerHeight };
        
        // Создаем стандартную перспективную камеру Three.js
        const camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height, 0.1, 100);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true });
        renderer.setSize(sizes.width, sizes.height);

        const imgCanvas = document.createElement('canvas');
        const ctx = imgCanvas.getContext('2d', { willReadFrequently: true });

        const loadWeaponParticles = (fileName) => {
            isChanging = true;

            const image = new Image();
            image.crossOrigin = "anonymous";
            image.src = "https://moy.su" + fileName; 

            image.onload = () => {
                if(points !== null){
                    scene.remove(points);
                    geometry.dispose();
                }

                targetPositions = [];
                colors = [];

                const isAWP = fileName.toLowerCase().includes('awp');
                const width = isAWP ? 220 : 180; 
                const height = Math.round((image.height / image.width) * width);
                
                imgCanvas.width = width;
                imgCanvas.height = height;
                ctx.drawImage(image, 0, 0, width, height);
                const imgData = ctx.getImageData(0, 0, width, height).data;

                const scaleFactor = isAWP ? 0.035 : 0.04;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const index = (y * width + x) * 4;
                        if (imgData[index + 3] > 40) {
                            const tX = (x - width / 2) * scaleFactor;
                            const tY = -(y - height / 2) * scaleFactor; // Инвертируем Y, чтобы пушка не была перевернутой
                            const tZ = (Math.random() - 0.5) * 0.05;
                            
                            targetPositions.push(tX, tY, tZ);
                            colors.push(imgData[index]/255, imgData[index+1]/255, imgData[index+2]/255);
                        }
                    }
                }

                geometry = new THREE.BufferGeometry();
                const initPositions = new Float32Array(targetPositions.length);
                geometry.setAttribute('position', new THREE.BufferAttribute(initPositions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
                
                material = new THREE.PointsMaterial({
                    size: 0.04,
                    vertexColors: true,
                    transparent: true
                });

                points = new THREE.Points(geometry, material);
                scene.add(points);
                
                weaponStartTime = performance.now();
                isChanging = false;
            };

            image.onerror = () => {
                isChanging = false;
                nextWeapon();
            };
        };

        const nextWeapon = () => {
            currentWeaponIndex = (currentWeaponIndex + 1) % weaponsList.length;
            loadWeaponParticles(weaponsList[currentWeaponIndex]);
        };

        loadWeaponParticles(weaponsList[currentWeaponIndex]);

        // Интервал смены строго равен 6 секундам
        setInterval(nextWeapon, 6000);

        window.addEventListener('resize', () => {
            sizes.width = window.innerWidth;
            sizes.height = window.innerHeight;
            camera.aspect = sizes.width / sizes.height;
            camera.updateProjectionMatrix();
            renderer.setSize(sizes.width, sizes.height);
        });

        const clock = new THREE.Clock();
        
        const tick = () => {
            if (points && targetPositions.length > 0 && !isChanging) {
                const posArray = points.geometry.attributes.position.array;
                const elapsed = (performance.now() - weaponStartTime) / 1000; 
                
                let progress = 0;
                let currentYOffset = 0;
                let currentScale = 1;

                if (elapsed <= 2.5) {
                    // Фаза 1 (До 2.5 сек): Все частицы ОДНОВРЕМЕННО летят сверху (от +5) к центру (0) и увеличиваются (от 0.2 до 1.0)
                    progress = elapsed / 2.5;
                    currentYOffset = 5 * (1 - progress); 
                    currentScale = 0.2 + 0.8 * progress;
                    
                } else if (elapsed > 2.5 && elapsed <= 4.0) {
                    // Фаза 2 (С 2.5 до 4.0 сек): Замирание по центру в 100% масштабе
                    currentYOffset = 0;
                    currentScale = 1;
                    
                } else if (elapsed > 4.0 && elapsed <= 6.0) {
                    // Фаза 3 (С 4.0 до 6.0 сек): Все частицы ОДНОВРЕМЕННО улетают вниз (до -6)
                    progress = (elapsed - 4.0) / 2.0;
                    currentYOffset = -6 * progress; 
                    currentScale = 1.0 - 0.3 * progress;
                }

                // Обновляем координаты вершин с учетом масштабирования и движения по Y
                for (let i = 0; i < posArray.length; i += 3) {
                    posArray[i] = targetPositions[i] * currentScale; 
                    posArray[i+1] = (targetPositions[i+1] * currentScale) + currentYOffset; 
                    posArray[i+2] = targetPositions[i+2] * currentScale; 
                }

                points.geometry.attributes.position.needsUpdate = true;
                points.rotation.y = clock.getElapsedTime() * 0.45; 
            }
            
            renderer.render(scene, camera);
            window.requestAnimationFrame(tick);
        };
        tick();
    });
</script>

</body>
</html>
