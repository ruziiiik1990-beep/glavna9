<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Auto Particles Showcase (Optimized Pairs)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: transparent; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; background: transparent; }
    </style>
</head>
<body>

<canvas class="webgl"></canvas>

<!-- Подключаем официальную стабильную библиотеку Three.js -->
<script src="https://cloudflare.com"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.querySelector('canvas.webgl');
        const scene = new THREE.Scene();

        // ТВOЙ ПОЛНЫЙ ПРОВЕРЕННЫЙ СПИСОК ИМЕН
        const weaponsList = [
            'ak-47_kolymaga.png',
            'AK-47_diletanti.png',
            'AK-47_fantomni_vreditel.png',
            'AK-47_led9noi_ygol.png',
            'AK-47_nyvo_ryzh.png',
            'AK-47_zhgycha9_9rkost.png',
            'AWP_dvoistvennost.png',
            'AWP_konec.png',
            'AWP_led9noi_ygol.png',
            'AWP_mortic.png',
            'AWP_zelena9_energia.png',
            'AWPelitnoe_snar9zhenie.png',
            'M4A1-S_4erni_lotoc.png',
            'M4A1-S_diki_tysovchik.png',
            'M4A1-S_no4noi_koshmar.png',
            'M4A1-S_panel_ypravleni9.png',
            'M4A1-S_stratosfera.png',
            'M4A1-S_yedinenie.png',
            'M4A4_adok.png',
            'M4A4_zybna9_fei.png'
        ];
        
        let currentPairIndex = 0; 
        let geometry = null;
        let material = null;
        let points = null;

        let targetPositions = [];
        let currentPositions = [];
        let colors = [];
        let isChanging = false;

        const sizes = { width: window.innerWidth, height: window.innerHeight };
        
        // Настраиваем камеру
        const camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height, 0.1, 100);
        camera.position.set(0, 0, 5);
        camera.lookAt(scene.position);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(sizes.width, sizes.height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const imgCanvas = document.createElement('canvas');
        const ctx = imgCanvas.getContext('2d', { willReadFrequently: true });

        // Функция загрузки пары оружия
        const loadWeaponPair = (index1, index2) => {
            isChanging = true;
            
            targetPositions = [];
            currentPositions = [];
            colors = [];

            let loadedFiles = 0;
            const processImage = (fileName, isLeftItem) => {
                const image = new Image();
                image.crossOrigin = "anonymous";
                image.src = "https://moy.su" + fileName;

                image.onload = () => {
                    const isAWP = fileName.toLowerCase().includes('awp');
                    const width = isAWP ? 160 : 130; 
                    const height = Math.round((image.height / image.width) * width);
                    
                    imgCanvas.width = width;
                    imgCanvas.height = height;
                    ctx.clearRect(0, 0, width, height);
                    ctx.drawImage(image, 0, 0, width, height);
                    const imgData = ctx.getImageData(0, 0, width, height).data;

                    const scaleFactor = isAWP ? 0.028 : 0.032;
                    
                    // Левый автомат смещаем на -1.4, правый на +1.4, чтобы стояли рядышком
                    const offsetX = isLeftItem ? -1.4 : 1.4;

                    for (let y = 0; y < height; y++) {
                        for (let x = 0; x < width; x++) {
                            const pixelIndex = (y * width + x) * 4;
                            if (imgData[pixelIndex + 3] > 40) {
                                const tX = offsetX + (x - width / 2) * scaleFactor;
                                const tY = (y - height / 2) * scaleFactor; 
                                const tZ = (Math.random() - 0.5) * 0.12;
                                targetPositions.push(tX, tY, tZ);

                                // Оригинальное падение пикселей сверху вниз
                                currentPositions.push(
                                    tX + (Math.random() - 0.5) * 1.5,
                                    tY - 5 - Math.random() * 4, 
                                    tZ + (Math.random() - 0.5) * 1.5
                                );
                                colors.push(imgData[pixelIndex]/255, imgData[pixelIndex+1]/255, imgData[pixelIndex+2]/255);
                            }
                        }
                    }

                    loadedFiles++;
                    if (loadedFiles === 2) create3DObject();
                };

                image.onerror = () => {
                    loadedFiles++;
                    if (loadedFiles === 2) create3DObject();
                };
            };

            processImage(weaponsList[index1], true);
            processImage(weaponsList[index2], false);
        };

        function create3DObject() {
            if(points !== null){
                scene.remove(points);
                geometry.dispose();
            }

            if (currentPositions.length === 0) {
                isChanging = false;
                return;
            }

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(currentPositions), 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
            
            material = new THREE.PointsMaterial({
                size: 0.04,
                vertexColors: true,
                transparent: true
            });
            
            points = new THREE.Points(geometry, material);
            scene.add(points);
            
            isChanging = false;
        }

        const nextWeaponPair = () => {
            currentPairIndex = (currentPairIndex + 2) % weaponsList.length;
            const nextIndex2 = (currentPairIndex + 1) % weaponsList.length;
            loadWeaponPair(currentPairIndex, nextIndex2);
        };

        // Запуск первой пары и интервала в 9 секунд
        loadWeaponPair(0, 1);
        setInterval(nextWeaponPair, 9000);

        window.addEventListener('resize', () => {
            sizes.width = window.innerWidth;
            sizes.height = window.innerHeight;
            camera.aspect = sizes.width / sizes.height;
            camera.updateProjectionMatrix();
            renderer.setSize(sizes.width, sizes.height);
        });

        const clock = new THREE.Clock();
        const tick = () => {
            if (points && currentPositions.length > 0 && !isChanging) {
                const posArray = points.geometry.attributes.position.array;
                for (let i = 0; i < posArray.length; i++) {
                    posArray[i] += (targetPositions[i] - posArray[i]) * 0.05;
                }
                points.rotation.y = clock.getElapsedTime() * 0.45; 
            }
            renderer.render(scene, camera);
            window.requestAnimationFrame(tick);
        };
        tick();
    });
</script>

</body>
</html>
