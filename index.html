<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Premium Showcase Slider</title>
    <style>
        /* Базовые стили Swiper, вшитые для стабильности */
        .swiper{margin-left:auto;margin-right:auto;position:relative;overflow:hidden;list-style:none;padding:0;z-index:1;display:block}
        .swiper-wrapper{position:relative;width:100%;height:100%;z-index:1;display:flex;transition-property:transform;transition-timing-function:var(--swiper-wrapper-transition-timing-function,initial);box-sizing:content-box}
        .swiper-slide{flex-shrink:0;width:100%;height:100%;position:relative;transition-property:transform;display:block}

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #0f0f12; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            width: 100vw; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 20px;
        }

        /* Главный контейнер баннера-слайдера */
        .showcase-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            height: 420px;
            background: #111111;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .promo-slider {
            width: 100%;
            height: 100%;
        }

        /* Структура слайда: Текст слева, Медиа справа */
        .showcase-slide {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Левый контентный блок */
        .info-block {
            width: 38%;
            height: 90%;
            background: #ffffff;
            margin: auto 0 auto 25px;
            border-radius: 20px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 5;
            box-shadow: 5px 0 25px rgba(0,0,0,0.15);
        }

        .info-content h2 {
            color: #000000;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 15px;
        }

        .info-content p {
            color: #555555;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .promo-btn {
            display: inline-block;
            background: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 10px;
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .promo-btn:hover { background: #2563eb; }
        .promo-btn:active { transform: scale(0.98); }

        /* Блок навигации */
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .nav-btn {
            width: 36px;
            height: 36px;
            background: #000000;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }
        .nav-btn:hover { background: #222222; }

        .nav-btn svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .fraction-pagination {
            font-size: 14px;
            font-weight: 600;
            color: #666666;
            min-width: 35px;
            text-align: center;
        }

        /* Правая большая медиа-зона */
        .media-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 65%;
            height: 100%;
            overflow: hidden;
        }

        /* Сетка/контейнер для анимируемых предметов оружия */
        .anime-weapon-scene {
            width: 100%;
            height: 100%;
            background: #09090b;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 15px;
        }

        /* Карточка отдельного оружия */
        .weapon-item {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            opacity: 0; /* Изначально скрыты для плавного старта Anime.js */
        }

        .weapon-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .slide-bg-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
