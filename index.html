<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 Auto Particles Showcase (Optimized)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: transparent; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; background: transparent; }
    </style>
</head>
<body>

<canvas class="webgl"></canvas>

<!-- Подключаем стабильную библиотеку Three.js -->
<script src="https://cloudflare.com"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const canvas = document.querySelector('canvas.webgl');
        const scene = new THREE.Scene();

        const weaponsList = [
            'ak-47_kolymaga.png', 'AK-47_diletanti.png', 'AK-47_fantomni_vreditel.png',
            'AK-47_led9noi_ygol.png', 'AK-47_nyvo_ryzh.png', 'AK-47_zhgycha9_9rkost.png',
            'AWP_dvoistvennost.png', 'AWP_konec.png', 'AWP_led9noi_ygol.png',
            'AWP_mortic.png', 'AWP_zelena9_energia.png', 'AWPelitnoe_snar9zhenie.png',
            'M4A1-S_4erni_lotoc.png', 'M4A1-S_diki_tysovchik.png', 'M4A1-S_no4noi_koshmar.png',
            'M4A1-S_panel_ypravleni9.png', 'M4A1-S_stratosfera.png', 'M4A1-S_yedinenie.png',
            'M4A4_adok.png', 'M4A4_zybna9_fei.png'
        ];
        
        let globalTargetPositions = [];
        let globalCurrentPositions = [];
        let globalColors = [];
        
        let geometry = null;
        let material = null;
        let points = null;
        let loadedCount = 0;

        const sizes = { width: window.innerWidth, height: window.innerHeight };
        
        const camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height, 0.1, 100);
        camera.position.set(0, 0, 6);
        camera.lookAt(scene.position); 

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(sizes.width, sizes.height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const imgCanvas = document.createElement('canvas');
        const ctx = imgCanvas.getContext('2d', { willReadFrequently: true });

        weaponsList.forEach((fileName, index) => {
            const image = new Image();
            image.crossOrigin = "anonymous";
            image.src = "https://4ak4ak.moy.su/prizSkinFinalis/" + fileName; 

            image.onload = () => {
                const isAWP = fileName.toLowerCase().includes('awp');
                // Уменьшили разрешение считывания, чтобы сделать частицы плотнее
                const width = isAWP ? 80 : 65; 
                const height = Math.round((image.height / image.width) * width);
                
                imgCanvas.width = width;
                imgCanvas.height = height;
                ctx.clearRect(0, 0, width, height);
                ctx.drawImage(image, 0, 0, width, height);
                const imgData = ctx.getImageData(0, 0, width, height).data;

                // УМЕНЬШИЛИ МАСШТАБ самих моделей, чтобы они стали компактнее
                const scaleFactor = 0.015; 

                // СБЛИЗИЛИ ЦЕНТРЫ: Уменьшили коэффициенты радиуса (с 1.2 до 0.6 и шаг до 0.05)
                // Теперь они стоят на небольшом расстоянии друг от друга и гарантированно влезают в кадр
                const spiralRadius = 0.6 + (index * 0.05); 
                const spiralAngle = index * (Math.PI * 2 / weaponsList.length) * 2.0; 
                
                const centerX = Math.cos(spiralAngle) * spiralRadius;
                const centerY = Math.sin(spiralAngle) * spiralRadius;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const pixelIndex = (y * width + x) * 4;
                        if (imgData[pixelIndex + 3] > 50) {
                            const locX = (x - width / 2) * scaleFactor;
                            const locY = (y - height / 2) * scaleFactor; 
                            const locZ = (Math.random() - 0.5) * 0.05;

                            const tX = centerX + locX;
                            const tY = centerY + locY;
                            const tZ = locZ;

                            globalTargetPositions.push(tX, tY, tZ);

                            globalCurrentPositions.push(
                                centerX * 0.2 + (Math.random() - 0.5) * 5.0,
                                centerY * 0.2 + (Math.random() - 0.5) * 5.0,
                                locZ + (Math.random() - 0.5) * 5.0
                            );
                            
                            globalColors.push(imgData[pixelIndex]/255, imgData[pixelIndex+1]/255, imgData[pixelIndex+2]/255);
                        }
                    }
                }

                loadedCount++;
                if (loadedCount === weaponsList.length) buildGlobalScene();
            };

            image.onerror = () => {
                loadedCount++;
                if (loadedCount === weaponsList.length) buildGlobalScene();
            };
        });

        function buildGlobalScene() {
            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(globalCurrentPositions), 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(globalColors), 3));
            
            material = new THREE.PointsMaterial({
                size: 0.025, // Немного уменьшили размер точек под новый масштаб
                vertexColors: true,
                transparent: true,
                opacity: 1.0
            });
            
            points = new THREE.Points(geometry, material);
            scene.add(points);
        }

        window.addEventListener('resize', () => {
            sizes.width = window.innerWidth;
            sizes.height = window.innerHeight;
            camera.aspect = sizes.width / sizes.height;
            camera.updateProjectionMatrix();
            renderer.setSize(sizes.width, sizes.height);
        });

        const clock = new THREE.Clock();
        const tick = () => {
            const time = clock.getElapsedTime();
            
            // Оставили оригинальные параметры замедленного зума и фокуса камеры
            camera.position.z = 6.2 + Math.sin(time * 0.375) * 1.6; 
            camera.lookAt(scene.position); 

            if (points && globalCurrentPositions.length > 0) {
                const posArray = points.geometry.attributes.position.array;

                for (let i = 0; i < posArray.length; i += 3) {
                    const tx = globalTargetPositions[i];
                    const ty = globalTargetPositions[i+1];
                    const tz = globalTargetPositions[i+2];

                    const angle = time * 0.2; 
                    const rotatedX = tx * Math.cos(angle) - ty * Math.sin(angle);
                    const rotatedY = tx * Math.sin(angle) + ty * Math.cos(angle);

                    posArray[i] += (rotatedX - posArray[i]) * 0.03;
                    posArray[i+1] += (rotatedY - posArray[i+1]) * 0.03;
                    posArray[i+2] += (tz - posArray[i+2]) * 0.03;
                }
                points.geometry.attributes.position.needsUpdate = true;
            }
            
            renderer.render(scene, camera);
            window.requestAnimationFrame(tick);
        };
        tick();
    });
</script>

</body>
</html>
