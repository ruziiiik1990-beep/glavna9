<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Pixel Art Tournament — Anime.js</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
      position: relative;
    }

    /* CRT эффект */
    .crt-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(
        rgba(16,16,16,0) 50%,
        rgba(0,0,0,0.25) 50%
      );
      background-size: 100% 4px;
      opacity: 0.7;
    }
    .vignette {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 70%);
      pointer-events: none;
      z-index: 9;
    }

    #stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 5;
    }

    .title {
      text-align: center;
      font-size: 24px;
      line-height: 1.2;
      margin-bottom: 40px;
      text-shadow: 0 0 4px #fff, 0 0 10px #ff0;
      opacity: 0;
    }

    .bracket-container {
      position: relative;
      width: 800px;
      max-width: 90%;
      height: 500px;
    }

    .match-card {
      position: absolute;
      border: 2px solid #333;
      background: #111;
      padding: 6px 8px;
      font-size: 12px;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
      opacity: 0;
      transform: scale(0.8) translateY(20px);
      will-change: transform, opacity;
      text-align: left;
      min-width: 140px;
    }

    .match-winner {
      border-color: #0f0;
      background: #040;
      color: #0f0;
      box-shadow: 0 0 12px rgba(0,255,0,0.4);
    }

    .match-final {
      border-color: #ff0;
      background: #220;
      color: #ff0;
      box-shadow: 0 0 16px rgba(255,255,0,0.5);
    }

    .vs-marker {
      position: absolute;
      font-size: 18px;
      color: #555;
      opacity: 0;
      will-change: opacity;
    }

    .prize-card {
      position: absolute;
      width: 110px;
      height: 110px;
      border: 3px solid #444;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      opacity: 0;
      transform: scale(0.5) translateY(60px);
      will-change: transform, opacity;
      box-shadow: 0 0 6px rgba(0,0,0,0.3);
    }

    .prize-gold {
      border-color: #fc0;
      box-shadow: 0 0 14px rgba(252,200,0,0.6);
    }
    .prize-silver {
      border-color: #ccc;
      box-shadow: 0 0 10px rgba(200,200,200,0.5);
    }

    .progress-bar-bg {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 8px;
      background: #333;
      border: 1px solid #000;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #0f0;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <div class="vignette"></div>
  <div class="crt-overlay"></div>

  <div id="stage">
    <div class="title">PIXEL PLAYOFF<br>ПУТЬ К ПРИЗАМ</div>

    <div class="bracket-container" id="bracket">
      <!-- Сюда JS будет вставлять карточки матчей -->
    </div>

    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress"></div>
    </div>
  </div>

  <!-- Подключаем Anime.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    const bracket = document.getElementById('bracket');
    const progress = document.getElementById('progress');
    const title = document.querySelector('.title');

    // Команды
    const teams = [
      'TEAM A', 'TEAM B', 'TEAM C', 'TEAM D',
      'TEAM E', 'TEAM F', 'TEAM G', 'TEAM H'
    ];

    // Призы
    const prizes = [
      { name: 'AK-47 Жгучая ярость', type: 'gold' },
      { name: 'AWP Зелёная энергия', type: 'gold' },
      { name: 'AK-47 Дилетанты', type: 'silver' },
      { name: 'M4A1-S Уединение', type: 'silver' },
      { name: 'AK-47 Фантомный вредитель', type: 'normal' }
    ];

    // Перемешать массив
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Рандомный победитель
    function randomWinner(a, b) {
      return Math.random() > 0.5 ? a : b;
    }

    // Создать карточку матча
    function createMatchCard(id, teamA, teamB, isWinnerA, isFinal) {
      const card = document.createElement('div');
      card.className = 'match-card' + (isWinnerA ? ' match-winner' : '') + (isFinal ? ' match-final' : '');
      card.id = 'match-' + id;
      card.innerHTML = `
        <div>${teamA}</div>
        <div style="color:#555">VS</div>
        <div>${teamB}</div>
      `;
      return card;
    }

    // Позиции для сетки (упрощённо)
    const positions = {
      qf1: { top: 40, left: 40 },
      qf2: { top: 170, left: 40 },
      qf3: { top: 300, left: 40 },
      qf4: { top: 430, left: 40 },

      sf1: { top: 105, left: 260 },
      sf2: { top: 365, left: 260 },

      final: { top: 235, left: 520 }
    };

    function initBracket() {
      // Перемешиваем команды
      const shuffled = shuffle(teams);

      // Четвертьфиналы
      const qf1 = createMatchCard('qf1', shuffled[0], shuffled[1], true, false);
      const qf2 = createMatchCard('qf2', shuffled[2], shuffled[3], false, false);
      const qf3 = createMatchCard('qf3', shuffled[4], shuffled[5], true, false);
      const qf4 = createMatchCard('qf4', shuffled[6], shuffled[7], false, false);

      bracket.appendChild(qf1);
      bracket.appendChild(qf2);
      bracket.appendChild(qf3);
      bracket.appendChild(qf4);

      // Полуфиналы (рандомные победители)
      const sf1Winner = randomWinner(shuffled[0], shuffled[1]);
      const sf2Winner = randomWinner(shuffled[2], shuffled[3]);
      const sf3Winner = randomWinner(shuffled[4], shuffled[5]);
      const sf4Winner = randomWinner(shuffled[6], shuffled[7]);

      const sf1 = createMatchCard('sf1', sf1Winner, sf2Winner, true, false);
      const sf2 = createMatchCard('sf2', sf3Winner, sf4Winner, false, false);
      bracket.appendChild(sf1);
      bracket.appendChild(sf2);

      // Финал
      const finalWinner = randomWinner(sf1Winner, sf3Winner); // упрощение
      const finalCard = createMatchCard('final', sf1Winner, sf3Winner, finalWinner === sf1Winner, true);
      bracket.appendChild(finalCard);

      // Привязываем позиции
      const ids = ['qf1','qf2','qf3','qf4','sf1','sf2','final'];
      ids.forEach(id => {
        const el = document.getElementById('match-' + id);
        const p = positions[id];
        el.style.top = p.top + 'px';
        el.style.left = p.left + 'px';
      });

      // Рисуем линии (SVG)
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', '100%');
      svg.setAttribute('height', '100%');
      svg.style.position = 'absolute';
      svg.style.top = 0;
      svg.style.left = 0;
      svg.style.pointerEvents = 'none';
      svg.style.zIndex = 0;
      bracket.appendChild(svg);

      function line(x1, y1, x2, y2) {
        const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l.setAttribute('x1', x1); l.setAttribute('y1', y1);
        l.setAttribute('x2', x2); l.setAttribute('y2', y2);
        l.setAttribute('stroke', '#333');
        l.setAttribute('stroke-width', 2);
        l.setAttribute('opacity', 0);
        svg.appendChild(l);
        return l;
      }

      // QF → SF
      line(180, 95, 260, 125);
      line(180, 225, 260, 125);
      line(180, 355, 260, 385);
      line(180, 485, 260, 385);

      // SF → Final
      line(400, 155, 520, 255);
      line(400, 415, 520, 255);

      return { qf1, qf2, qf3, qf4, sf1, sf2, finalCard, svg };
    }

    const elements = initBracket();

    // Анимация
    const tl = anime.timeline({
      easing: 'easeOutQuad',
      duration: 1000
    });

    // 0–2 сек: заголовок
    tl.add({
      targets: title,
      opacity: [0, 1],
      scale: [0.8, 1],
      delay: 200
    })
    .add({
      targets: '.match-card',
      opacity: [0, 1],
      translateY: [20, 0],
      delay: (el, i) => 300 + i * 150
    }, '-=800')
    .add({
      targets: 'line',
      opacity: [0, 1],
      strokeDashoffset: [anime.path('line'), 0], // простой эффект рисования
      duration: 1200,
      easing: 'linear'
    }, '-=600');

    // 4–6 сек: полуфиналы и финал
    tl.add({
      targets: [elements.sf1, elements.sf2, elements.finalCard],
      scale: [1, 1.1, 1],
      loop: 2,
      duration: 600,
      easing: 'easeInOutSine'
    }, '-=400');

    // 7–8 сек: прогресс-бар
    tl.add({
      targets: progress,
      width: ['0%', '100%'],
      duration: 2000,
      easing: 'linear'
    }, '-=1000');

    // 8–10 сек: призы
    const prizeContainer = document.createElement('div');
    prizeContainer.style.position = 'absolute';
    prizeContainer.style.bottom = '140px';
    prizeContainer.style.left = '50%';
    prizeContainer.style.transform = 'translateX(-50%)';
    prizeContainer.style.display = 'flex';
    prizeContainer.style.gap = '20px';
    document.body.appendChild(prizeContainer);

    const shuffledPrizes = shuffle(prizes);
    shuffledPrizes.forEach((p, i) => {
      const pc = document.createElement('div');
      pc.className = `prize-card prize-${p.type}`;
      pc.innerHTML = `<div style="font-size:10px">${p.name.split(' ').slice(0,2).join(' ')}</div><div style="font-size:8px">${p.name.split(' ').slice(2).join(' ')}</div>`;
      prizeContainer.appendChild(pc);

      tl.add({
        targets: pc,
        opacity: [0, 1],
        scale: [0.5, 1],
        translateY: [60, 0],
        delay: i * 200,
        duration: 400,
        easing: 'easeOutBack'
      }, '-=500');
    });

    tl.play();
  </script>
</body>
</html>
