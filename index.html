<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Pixel Art Tournament — Anime.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: 'Courier New', Courier, monospace;
      color: #fff;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .pixel-card {
      position: absolute;
      background: #222;
      border: 2px solid #0f0;
      color: #fff;
      padding: 16px;
      font-size: 14px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,255,0,0.3);
      opacity: 0;
      transform: scale(0.5) translateY(100px);
      will-change: transform, opacity;
    }
    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        rgba(18,16,16,0) 50%,
        rgba(0,0,0,0.25) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
    }
    .crt-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 10px solid #333;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      z-index: 11;
    }
    .final-block {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #222;
      border: 4px solid #ff0;
      color: #ff0;
      padding: 20px;
      font-size: 24px;
      text-align: center;
      text-shadow: 0 0 10px #ff0;
      opacity: 0;
      will-change: opacity, transform;
    }
    .prize-icon {
      position: absolute;
      width: 64px;
      height: 64px;
      background: #333;
      border: 2px solid #fff;
      opacity: 0;
      transform: scale(0);
      will-change: transform, opacity;
    }
    .text-pop {
      position: absolute;
      font-size: 20px;
      color: #fff;
      text-shadow: 2px 2px 0 #000;
      opacity: 0;
      transform: scale(0.5);
      will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="scanlines"></div>
    <div class="crt-frame"></div>

    <!-- Блок «ФИНАЛ» -->
    <div class="final-block">ФИНАЛ<br><small>Путь к призам</small></div>

    <!-- Карточки команд (пример) -->
    <div class="pixel-card" style="top: 20%; left: 10%;">Команда M<br>vs<br>Команда N</div>
    <div class="pixel-card" style="top: 20%; right: 10%;">Полуфинал<br>Запад vs Восток</div>

    <!-- Иконки призов (позиции условные) -->
    <div class="prize-icon" style="bottom: 80px; left: 20%;" data-name="AK-47 Жгучая ярость"></div>
    <div class="prize-icon" style="bottom: 80px; left: 40%;" data-name="AWP Зелёная энергия"></div>
    <div class="prize-icon" style="bottom: 80px; left: 60%;" data-name="AK-47 Дилетанты"></div>
    <div class="prize-icon" style="bottom: 80px; left: 80%;" data-name="M4A1-S Уединение"></div>

    <!-- Текст победы -->
    <div class="text-pop" style="top: 30%; left: 50%; transform: translateX(-50%) scale(0.5);">ПОБЕДА!</div>
    <div class="text-pop" style="top: 60%; left: 50%; transform: translateX(-50%) scale(0.5);">ПРИЗЫ НАЙДЕНЫ!</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    const tl = anime.timeline({
      autoplay: true,
      easing: 'easeOutQuad',
      duration: 2000
    });

    // 0–2 сек: появление сетки и блока «ФИНАЛ»
    tl.add({
      targets: '.final-block',
      opacity: [0, 1],
      scale: [0.8, 1],
      delay: 200,
      easing: 'easeOutBack'
    })
    .add({
      targets: '.pixel-card',
      opacity: [0, 1],
      translateY: [20, 0],
      delay: (el, i) => 300 + i * 150,
      easing: 'easeOutQuad'
    }, '-=800');

    // 2–4 сек: мерцание финала
    tl.add({
      targets: '.final-block',
      opacity: [1, 0.3, 1, 0.3, 1],
      scale: [1, 1.05, 1, 1.05, 1],
      duration: 2000,
      easing: 'linear'
    });

    // 4–6 сек: финал на Anubis (имитация дыма/вспышек — через пульсацию сканлайнов)
    tl.add({
      targets: '.scanlines',
      opacity: [1, 0.6, 1, 0.6, 1],
      duration: 2000,
      easing: 'linear'
    }, '-=2000');

    // 6–8 сек: победа
    tl.add({
      targets: '.text-pop:first-child',
      opacity: [0, 1],
      scale: [0.5, 1],
      duration: 600,
      easing: 'easeOutBack'
    })
    .add({
      targets: '.text-pop:first-child',
      scale: [1, 1.1, 1],
      duration: 1000,
      loop: 3,
      easing: 'easeInOutSine'
    }, '-=400');

    // 8–10 сек: вылет призов
    tl.add({
      targets: '.prize-icon',
      opacity: [0, 1],
      scale: [0, 1],
      delay: (el, i) => i * 200,
      duration: 400,
      easing: 'easeOutBack'
    }, '-=600')
    .add({
      targets: '.text-pop:last-child',
      opacity: [0, 1],
      scale: [0.5, 1],
      duration: 600,
      easing: 'easeOutBack'
    }, '-=800');
  </script>
</body>
</html>
